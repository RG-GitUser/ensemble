<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Ensemble's mark: three voices on the brand ramp. Kept in step with
       public/favicon.ico and public/apple-icon.png, which draw the same
       geometry as raster. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7.04" fill="url(#g)"/>
  <g fill="#ffffff">
    <rect x="6.56" y="9.92" width="4.16" height="12.16" rx="2.08"/>
    <rect x="13.92" y="6.08" width="4.16" height="19.84" rx="2.08"/>
    <rect x="21.28" y="8.64" width="4.16" height="14.72" rx="2.08"/>
  </g>
</svg>
